apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitmate-backend
  labels:
    app: splitmate-backend
    app.kubernetes.io/name: splitmate-backend
    app.kubernetes.io/part-of: splitmate-expense-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splitmate-backend
  template:
    metadata:
      labels:
        app: splitmate-backend
    spec:
      containers:
        - name: backend
          # Replace with your Azure Container Registry image tag, e.g. <youracr>.azurecr.io/splitmate-backend:v1
          image: palakfocclab226.azurecr.io/splitmate-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: splitmate-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: splitmate-config
                  key: NODE_ENV
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: splitmate-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: splitmate-config
                  key: REDIS_PORT
            - name: DEFAULT_CURRENCY
              valueFrom:
                configMapKeyRef:
                  name: splitmate-config
                  key: DEFAULT_CURRENCY
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: splitmate-config
                  key: FRONTEND_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: splitmate-secret
                  key: REDIS_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: splitmate-backend
  labels:
    app: splitmate-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: splitmate-backend
