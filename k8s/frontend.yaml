apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitmate-frontend
  labels:
    app: splitmate-frontend
    app.kubernetes.io/name: splitmate-frontend
    app.kubernetes.io/part-of: splitmate-expense-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splitmate-frontend
  template:
    metadata:
      labels:
        app: splitmate-frontend
    spec:
      containers:
        - name: frontend
          # Replace with your Azure Container Registry image tag, e.g. <youracr>.azurecr.io/splitmate-frontend:v1
          image: palakfocclab226.azurecr.io/splitmate-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: splitmate-frontend
  labels:
    app: splitmate-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: splitmate-frontend
