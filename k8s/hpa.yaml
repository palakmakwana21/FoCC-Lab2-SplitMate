apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: splitmate-backend-hpa
  labels:
    app: splitmate-backend
    app.kubernetes.io/name: splitmate-backend
    app.kubernetes.io/part-of: splitmate-expense-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: splitmate-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
